<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pocket Guitar</title>
<style>
  :root {
    --bg: #1a120b; --wood: #3a2417; --wood-light: #5a3a23;
    --fb1: #4a2f1c; --fb2: #311d11;
    --amber: #e8a14b; --amber-bright: #ffc777;
    --string: #d9c4a3; --text: #f3e7d3; --muted: #8a7355;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; width: 100%; }

  /* ORIENTATION PIN: portrait viewport (e.g. rotation lock on) -> rotate the
     whole app 90deg so the guitar always renders along the phone's long edge. */
  @media (orientation: portrait) {
    #app {
      position: fixed; top: 0; left: 0;
      width: 100vh; height: 100vw;
      transform-origin: top left;
      transform: translateX(100vw) rotate(90deg);
    }
  }

  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 12px; padding-top: max(4px, env(safe-area-inset-top));
    background: linear-gradient(180deg, #2a1a10, #1a120b);
    border-bottom: 1px solid #000; flex: 0 0 auto;
  }
  #topbar h1 { font-size: 13px; margin: 0; letter-spacing: .5px; font-weight: 600; }
  #topbar h1 span { color: var(--amber); }
  .controls { display: flex; gap: 8px; }
  .chip {
    font-size: 11px; padding: 5px 10px; border-radius: 13px;
    background: #2c1c11; border: 1px solid #4a3019; color: var(--muted);
  }
  .chip.on { color: #0c0c0c; background: var(--amber); border-color: var(--amber-bright); font-weight: 600; }

  #play { flex: 1; display: flex; min-height: 0; }
  #fretboard {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: linear-gradient(160deg, var(--fb1), var(--fb2) 70%, #271810);
  }
  #fbhead { display: flex; height: 16px; flex: 0 0 auto; }
  .fhcell { flex: 1; text-align: center; font-size: 9px; line-height: 16px; color: rgba(255,255,255,.4); }
  .fhcell.nut { flex: 0 0 46px; }

  .fret-row {
    flex: 1; position: relative; display: flex; min-height: 0;
    border-bottom: 1px solid rgba(0,0,0,.25);
  }
  .fret-row:last-child { border-bottom: none; }
  .string-line {
    position: absolute; left: 46px; right: 0; top: 50%;
    height: var(--thick, 2px); transform: translateY(-50%);
    background: linear-gradient(180deg, #fff6e0, var(--string) 40%, #9c8763);
    border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.5);
    pointer-events: none; z-index: 1;
  }
  .string-line.pluck { animation: pluck .5s ease-out; }
  @keyframes pluck {
    0%   { filter: none; transform: translateY(-50%) scaleY(1); }
    12%  { filter: brightness(1.9); transform: translateY(-50%) scaleY(3.2); box-shadow: 0 0 14px rgba(255,210,120,.9); }
    100% { filter: none; transform: translateY(-50%) scaleY(1); }
  }
  .cell {
    flex: 1; position: relative; z-index: 2;
    border-right: 2px solid rgba(0,0,0,.45);
  }
  .cell.nut {
    flex: 0 0 46px; border-right: 4px solid #e8d9b5;
    background: linear-gradient(90deg, rgba(0,0,0,.25), rgba(0,0,0,0));
  }
  .cell.inlay::before {
    content: ''; position: absolute; left: 50%; top: 0; width: 7px; height: 7px;
    transform: translate(-50%, -3.5px); border-radius: 50%; background: rgba(255,245,220,.18);
  }
  .cell.pressed::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 26px; height: 26px; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--amber) 55%, #b9742a);
    box-shadow: 0 1px 4px rgba(0,0,0,.6); z-index: 3;
  }
  .cell.nut::after {
    content: "O"; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%); font-size: 12px; font-weight: 700; color: rgba(255,255,255,.4);
  }

  #strum {
    flex: 0 0 116px; display: flex; flex-direction: column;
    border-left: 3px solid #1c120a;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,0,0,.45), transparent 70%),
      linear-gradient(180deg, #6b4326, #4a2d18);
  }
  .strum-row {
    flex: 1; position: relative; display: flex; align-items: center;
    border-bottom: 1px solid rgba(0,0,0,.2);
  }
  .strum-row:last-child { border-bottom: none; }
  .strum-row .stub {
    position: absolute; left: 0; right: 0; top: 50%;
    height: var(--thick, 2px); transform: translateY(-50%);
    background: linear-gradient(180deg, #fff6e0, var(--string) 40%, #9c8763);
    box-shadow: 0 1px 2px rgba(0,0,0,.5); pointer-events: none;
  }
  .strum-row .stub.pluck { animation: pluck .5s ease-out; }
  #strumLabel {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%) rotate(90deg);
    transform-origin: right center; font-size: 10px; color: rgba(255,255,255,.3);
    pointer-events: none; white-space: nowrap;
  }

  #start {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 40%, #2c1a10, #120c07);
  }
  #start h2 { font-size: 26px; margin: 0 0 6px; }
  #start h2 span { color: var(--amber); }
  #start p { color: var(--muted); max-width: 400px; line-height: 1.5; margin: 6px 0 22px; }
  #startBtn {
    font-size: 17px; font-weight: 700; color: #2a1a0a;
    background: linear-gradient(160deg, var(--amber-bright), var(--amber));
    border: none; border-radius: 28px; padding: 14px 36px;
    box-shadow: 0 6px 20px rgba(232,161,75,.45);
  }
  #startBtn:active { transform: scale(.97); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Pocket <span>Guitar</span></h1>
    <div class="controls">
      <div id="tiltChip" class="chip">Tilt: off</div>
    </div>
  </div>
  <div id="play">
    <div id="fretboard"></div>
    <div id="strum"><div id="strumLabel">strum / pick &rarr;</div></div>
  </div>
</div>

<div id="start">
  <h2>Pocket <span>Guitar</span></h2>
  <p>Hold your phone sideways. Press frets with your left fingers to shape a chord, then strum or pick on the right. While a string rings you can hammer onto a higher fret or slide your finger along it. Let go and the note stops.</p>
  <button id="startBtn">Tap to start playing</button>
</div>

<script>
"use strict";

/* ============================================================
   MUSIC DATA — standard tuning, string 0 = low E ... 5 = high e.
   DISPLAY_ORDER lays them top->bottom: high e on top, low E on bottom.
   ============================================================ */
const OPEN_FREQ = [82.4069, 110.0, 146.832, 195.998, 246.942, 329.628];
const NUM_FRETS = 5;
const DISPLAY_ORDER = [5, 4, 3, 2, 1, 0];

/* Fretting fingers: pointerId -> { i (string), c (fret, 0 = open/none) } */
const fingers = new Map();
function currentFret(i) {            // highest held fret (>0) on string i, or null
  let max = null;
  for (const v of fingers.values()) if (v.i === i && v.c > 0 && (max === null || v.c > max)) max = v.c;
  return max;
}
function soundingFret(i) { const f = currentFret(i); return f === null ? 0 : f; }
function soundingFreq(i) { return OPEN_FREQ[i] * Math.pow(2, soundingFret(i) / 12); }
function fingersOnString(i) { for (const v of fingers.values()) if (v.i === i) return true; return false; }

/* ============================================================
   AUDIO ENGINE — Karplus-Strong, with one managed voice per string
   so notes can be retriggered (hammer/slide) and stopped (let go).
   ============================================================ */
let ctx = null, master = null, reverbWet = null;
const bufferCache = new Map();
const voices = new Array(6).fill(null); // current ringing voice per string
const PICK_VOL = 0.6, HAMMER_VOL = 0.5, SLIDE_VOL = 0.42; // all uniform-ish, no strum dynamics

function initAudio() {
  if (ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = 0.9;
  const tone = ctx.createBiquadFilter(); tone.type = "lowpass"; tone.frequency.value = 5500;
  const convolver = ctx.createConvolver(); convolver.buffer = makeImpulse(1.6, 2.2);
  reverbWet = ctx.createGain(); reverbWet.gain.value = 0.18;
  master.connect(tone); tone.connect(ctx.destination);
  tone.connect(convolver); convolver.connect(reverbWet); reverbWet.connect(ctx.destination);
}
function makeImpulse(seconds, decay) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}
function pluckBuffer(freq) {
  const key = Math.round(freq * 2);
  if (bufferCache.has(key)) return bufferCache.get(key);
  const sr = ctx.sampleRate;
  const N = Math.max(2, Math.round(sr / freq));
  const len = Math.floor(sr * 3.2);
  const buf = ctx.createBuffer(1, len, sr);
  const y = buf.getChannelData(0);
  let prev = 0;
  for (let i = 0; i < N; i++) { const raw = Math.random() * 2 - 1; prev = 0.5 * (raw + prev); y[i] = prev; }
  const damping = 0.998 - Math.min(0.01, freq / 90000);
  for (let i = N; i < len; i++) y[i] = damping * 0.5 * (y[i - N] + y[i - N + 1]);
  // normalize peak so every note (low or high) comes out at the same level
  let peak = 0;
  for (let i = 0; i < len; i++) { const a = Math.abs(y[i]); if (a > peak) peak = a; }
  if (peak > 0) { const norm = 0.9 / peak; for (let i = 0; i < len; i++) y[i] *= norm; }
  bufferCache.set(key, buf);
  return buf;
}

// Stop a string's ringing voice with a fast fade so there's no click.
function stopVoice(i, fade) {
  const v = voices[i];
  if (!v) return;
  voices[i] = null;
  const f = fade == null ? 0.03 : fade;
  try {
    const now = ctx.currentTime;
    v.g.gain.cancelScheduledValues(now);
    v.g.gain.setValueAtTime(v.g.gain.value, now);
    v.g.gain.linearRampToValueAtTime(0, now + f);
    v.src.stop(now + f + 0.02);
  } catch (e) {}
}
// Start (or retrigger) a string's voice at its current sounding pitch.
function startVoice(i, vol) {
  if (!ctx) return;
  stopVoice(i, 0.012);
  const src = ctx.createBufferSource();
  src.buffer = pluckBuffer(soundingFreq(i));
  src.detune.value = (Math.random() - 0.5) * 6;
  const g = ctx.createGain();
  g.gain.value = vol;
  src.connect(g); g.connect(master);
  src.start();
  src.stop(ctx.currentTime + 3.2);
  const v = { src, g };
  voices[i] = v;
  src.onended = () => { if (voices[i] === v) voices[i] = null; };
  flashString(i);
}
function playString(i) { startVoice(i, PICK_VOL); } // a strum/pick hit

/* ============================================================
   FRETBOARD UI + INTERACTION
   Container-level pointer capture so slides and releases are reliable.
   ============================================================ */
const fbEl = document.getElementById("fretboard");
const stringRows = new Array(6);

function buildFretboard() {
  const head = document.createElement("div");
  head.id = "fbhead";
  for (let c = 0; c <= NUM_FRETS; c++) {
    const h = document.createElement("div");
    h.className = "fhcell" + (c === 0 ? " nut" : "");
    h.textContent = c === 0 ? "" : c;
    head.appendChild(h);
  }
  fbEl.appendChild(head);

  for (let d = 0; d < 6; d++) {
    const i = DISPLAY_ORDER[d];
    const row = document.createElement("div");
    row.className = "fret-row";
    const line = document.createElement("div");
    line.className = "string-line";
    line.style.setProperty("--thick", (5 - i * 0.55) + "px");
    row.appendChild(line);

    const cells = [];
    for (let c = 0; c <= NUM_FRETS; c++) {
      const cell = document.createElement("div");
      cell.className = "cell" + (c === 0 ? " nut" : "");
      cell.dataset.si = i;
      cell.dataset.fret = c;            // nut = 0
      if ((c === 3 || c === 5) && (i === 2 || i === 3)) cell.classList.add("inlay");
      row.appendChild(cell);
      cells.push(cell);
    }
    fbEl.appendChild(row);
    stringRows[i] = { line, cells };
  }
}

// Which { string, fret } is under a screen point (handles the CSS rotation).
function cellAtPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest && el.closest(".cell");
  if (!cell || cell.dataset.fret === undefined) return null;
  return { i: +cell.dataset.si, c: +cell.dataset.fret };
}

function renderPressed() {
  const set = new Set();
  for (const v of fingers.values()) if (v.c > 0) set.add(v.i + ":" + v.c);
  for (let i = 0; i < 6; i++) {
    const cells = stringRows[i].cells;
    for (let c = 1; c <= NUM_FRETS; c++) cells[c].classList.toggle("pressed", set.has(i + ":" + c));
  }
}

fbEl.addEventListener("pointerdown", (e) => {
  const hit = cellAtPoint(e.clientX, e.clientY);
  if (!hit) return;
  e.preventDefault();
  try { fbEl.setPointerCapture(e.pointerId); } catch (err) {}
  const before = soundingFret(hit.i);
  fingers.set(e.pointerId, { i: hit.i, c: hit.c });
  const after = soundingFret(hit.i);
  renderPressed();
  // Hammer-on: pressing a higher fret onto a string that's already ringing.
  if (ctx && voices[hit.i] && after > before) startVoice(hit.i, HAMMER_VOL);
});

fbEl.addEventListener("pointermove", (e) => {
  const cur = fingers.get(e.pointerId);
  if (!cur) return;
  e.preventDefault();
  const hit = cellAtPoint(e.clientX, e.clientY);
  if (!hit) return;
  // A slide stays on the finger's own string; only the fret (column) changes.
  const newC = hit.c;
  if (newC === cur.c) return;
  const before = soundingFret(cur.i);
  fingers.set(e.pointerId, { i: cur.i, c: newC });
  const after = soundingFret(cur.i);
  renderPressed();
  // Slide: pitch follows the finger (up or down) while the string rings.
  if (ctx && voices[cur.i] && after !== before) startVoice(cur.i, SLIDE_VOL);
});

function releaseFinger(pointerId) {
  const cur = fingers.get(pointerId);
  if (!cur) return;
  fingers.delete(pointerId);
  renderPressed();
  // Let go to stop: if no fingers remain on that string, damp its note.
  if (!fingersOnString(cur.i)) stopVoice(cur.i, 0.04);
}
// Robust release — these fire even if pointer capture was lost (fixes stuck notes).
window.addEventListener("pointerup", (e) => releaseFinger(e.pointerId));
window.addEventListener("pointercancel", (e) => releaseFinger(e.pointerId));

/* ============================================================
   STRUM STRIP — uses elementFromPoint so it survives the rotation.
   ============================================================ */
const strumEl = document.getElementById("strum");
const strumRows = new Array(6);
function buildStrum() {
  for (let d = 0; d < 6; d++) {
    const i = DISPLAY_ORDER[d];
    const r = document.createElement("div");
    r.className = "strum-row";
    r.dataset.si = i;
    const stub = document.createElement("div");
    stub.className = "stub";
    stub.style.setProperty("--thick", (5 - i * 0.55) + "px");
    r.appendChild(stub);
    strumEl.appendChild(r);
    strumRows[i] = r;
  }
}
function strumStringFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const row = el && el.closest && el.closest(".strum-row");
  return row ? parseInt(row.dataset.si, 10) : -1;
}
let strumming = false, lastRow = -1;
strumEl.addEventListener("pointerdown", (e) => {
  if (!ctx) return;
  e.preventDefault();
  strumming = true;
  const i = strumStringFromPoint(e.clientX, e.clientY); lastRow = i;
  if (i >= 0) playString(i);
  try { strumEl.setPointerCapture(e.pointerId); } catch (err) {}
});
strumEl.addEventListener("pointermove", (e) => {
  if (!strumming) return;
  e.preventDefault();
  const i = strumStringFromPoint(e.clientX, e.clientY);
  if (i >= 0 && i !== lastRow) { playString(i); lastRow = i; }
});
function endStrum() { strumming = false; lastRow = -1; }
strumEl.addEventListener("pointerup", endStrum);
strumEl.addEventListener("pointercancel", endStrum);
window.addEventListener("pointerup", endStrum);

function flashString(i) {
  const line = stringRows[i].line;
  line.classList.remove("pluck"); void line.offsetWidth; line.classList.add("pluck");
  const stub = strumRows[i] && strumRows[i].querySelector(".stub");
  if (stub) { stub.classList.remove("pluck"); void stub.offsetWidth; stub.classList.add("pluck"); }
}

/* ============================================================
   TILT (optional)
   ============================================================ */
const tiltChip = document.getElementById("tiltChip");
let tiltOn = false;
tiltChip.addEventListener("click", async () => {
  if (tiltOn) { disableTilt(); return; }
  try {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === "function") {
      const res = await DOE.requestPermission();
      if (res !== "granted") { tiltChip.textContent = "Tilt: denied"; return; }
    }
    window.addEventListener("deviceorientation", onTilt);
    tiltOn = true; tiltChip.classList.add("on"); tiltChip.textContent = "Tilt: on";
  } catch (err) { tiltChip.textContent = "Tilt: n/a"; }
});
function disableTilt() {
  window.removeEventListener("deviceorientation", onTilt);
  tiltOn = false; tiltChip.classList.remove("on"); tiltChip.textContent = "Tilt: off";
}
function onTilt(e) {
  if (!ctx || !master) return;
  const beta = e.beta || 0;
  master.gain.setTargetAtTime(0.9 + Math.sin(beta / 20) * 0.06, ctx.currentTime, 0.08);
}

/* ============================================================
   BOOT
   ============================================================ */
buildFretboard();
buildStrum();
document.getElementById("startBtn").addEventListener("click", () => {
  initAudio();
  if (ctx.state === "suspended") ctx.resume();
  [0, 1, 2, 3, 4, 5].forEach((s) => pluckBuffer(OPEN_FREQ[s])); // prime buffers
  document.getElementById("start").classList.add("hidden");
});
</script>
</body>
</html>
